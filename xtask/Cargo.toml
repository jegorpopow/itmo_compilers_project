[package]
name = "xtask"
authors = ["Pavel Grigorenko <GrigorenkoPV@niuitmo.ru>"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
testing = { path = "../compiler/testing", default-features = false }

anyhow.workspace = true
culpa.workspace = true
derive-where.workspace = true

json5 = "1.3.1"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }

[dependencies.clap]
version = "4.5.60"
default-features = false
features = [
    "color",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
    "cargo",
    "deprecated",
    "derive",
    "unicode",
]
