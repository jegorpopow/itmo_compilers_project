name: 'Coverage'
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # The repo is private
  pull-requests: read # We are checking Pull Requests, duh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read # The repo is private
      pull-requests: read # We are checking Pull Requests, duh
      checks: write # To add code annotations
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@704f92c11daa75bff5b4e01fcb083350c16c47b9 # v2.69.13
        with:
          tool: cargo-llvm-cov

      - name: Gather data
        run: cargo llvm-cov test --workspace --all-targets --lcov --output-path coverage.lcov

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage.lcov
          path: "./coverage.lcov"
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Add code annotations
        uses: ggilder/codecoverage@9f2933bb9cc49ffb598575216e12c102b0716219 # v1.3.1
        with:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          COVERAGE_FILE_PATH: "./coverage.lcov"
          COVERAGE_FORMAT: "lcov"
          DEBUG: coverage, pr_lines_added

      - name: Generate human-readable report
        run: cargo llvm-cov report --html --output-dir ./coverage
      - name: Upload human-readable report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-html
          path: "./coverage/html"
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@704f92c11daa75bff5b4e01fcb083350c16c47b9 # v2.69.13
        with:
          tool: cargo-llvm-cov

      - name: Gather data
        run: cargo llvm-cov test --workspace --all-targets --lcov --output-path baseline.lcov

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: baseline.lcov
          path: "./baseline.lcov"
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

  diff:
    name: Diff
    runs-on: ubuntu-latest
    needs:
      - baseline
      - coverage
    permissions:
      contents: read # The repo is private
      pull-requests: read # We are checking Pull Requests, duh
      actions: read # to download artifacts
    steps:
      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          pattern: "*.lcov"
          merge-multiple: true

      - name: Add coverage diff to job summary
        uses: GrigorenkoPV/lcov-reporter-action@b27940189ffdc4826e3e424b8410ec722a1670dd # v0.5.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          title: Coverage diff
          lcov-file: coverage.lcov
          lcov-base: baseline.lcov
          filter-changed-files: true
