[workspace]
resolver = "2"
members = ["compiler/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
authors = [
  "Pavel Grigorenko <GrigorenkoPV@niuitmo.ru>",
  "Jegor Popow <juicedogegor@gmail.com>",
  "Andrew Vlasenkov <andrew.vlasenkov70@gmail.com>",
]
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
culpa = "1.0.2"
derive-where = "1.6.1"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"

[profile.test]
opt-level = 1

########################## LINT SETTINGS ##########################

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
deprecated_in_future = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_local_definitions = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
unused_crate_dependencies = "warn"

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
default_trait_access = "allow"
default_union_representation = "deny"
doc_markdown = "allow"
empty_drop = "deny"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "deny"
exit = "deny"
filetype_is_file = "warn"
format_push_string = "deny"
get_unwrap = "deny"
implicit_clone = "deny"
inline_asm_x86_att_syntax = "deny"
iter_over_hash_type = "warn"
if_not_else = "allow"
let_underscore_must_use = "warn"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "warn"
missing_assert_message = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mixed_read_write_in_expression = "deny"
multiple_crate_versions = "warn"
negative_feature_names = "warn"
panic = "warn"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_if_nothing_returned = "allow"
semicolon_inside_block = "warn"
single_match_else = "allow"
string_lit_chars_any = "warn"
# string_slice = "warn"
tests_outside_test_module = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
upper_case_acronyms = "allow"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"
wildcard_enum_match_arm = "deny"
wildcard_imports = "allow"

big_endian_bytes = "deny"
host_endian_bytes = "deny"
